<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f172a"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ويب OS</title>
<style>
:root{--ac:#3b82f6;--bg:#0f172a;--pn:rgba(20,28,48,.88);--tx:#e8eefc;--bd:rgba(255,255,255,.14);--w:#1b2438}
body.light{--pn:rgba(255,255,255,.88);--tx:#101828;--bd:rgba(0,0,0,.15);--w:#f3f5f9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;color:var(--tx);background:#000;user-select:none}
#desk{position:fixed;inset:0 0 46px 0;background:var(--wp) center/cover;overflow:hidden}
#icons{position:absolute;inset:0;padding:10px;padding-top:120px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:6px}
.ic{width:84px;padding:8px 4px;text-align:center;border-radius:10px;cursor:pointer;font-size:12px;color:#fff;text-shadow:0 1px 3px #000}
.ic:hover,.ic.sel{background:rgba(255,255,255,.18)}
.ic b{display:block;font-size:34px;font-weight:400;line-height:1.2}
.win{position:absolute;background:var(--w);border:1px solid var(--bd);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden;min-width:260px;min-height:160px;resize:both}
.win.max{inset:0!important;width:auto!important;height:auto!important;border-radius:0;resize:none}
.win.min{display:none}
.tb{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--pn);cursor:grab;touch-action:none;flex:none}
.tb .t{flex:1;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb button{width:26px;height:26px;border:0;border-radius:7px;background:rgba(127,127,127,.25);color:var(--tx);cursor:pointer;font-size:13px}
.tb button.x:hover{background:#e11d48;color:#fff}
.body{flex:1;overflow:auto;position:relative;display:flex;flex-direction:column;min-height:0}
#tbar{position:fixed;bottom:0;left:0;right:0;height:46px;background:var(--pn);backdrop-filter:blur(14px);display:flex;align-items:center;gap:6px;padding:0 8px;border-top:1px solid var(--bd);z-index:99999}
#tbar button,.btn{background:rgba(127,127,127,.2);border:1px solid transparent;color:var(--tx);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;font-size:13px}
#tbar button:hover,.btn:hover{background:rgba(127,127,127,.38)}
#tasks{flex:1;display:flex;gap:5px;overflow:auto}
#tasks button{max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tasks button.on{border-color:var(--ac);background:rgba(59,130,246,.25)}
#start{background:var(--ac)!important;color:#fff!important;font-weight:700}
#menu{position:fixed;bottom:52px;right:8px;width:340px;max-width:calc(100% - 16px);max-height:70vh;background:var(--pn);backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:14px;padding:12px;z-index:99998;display:none;flex-direction:column;gap:8px}
#menu.on{display:flex}
#menu input,.inp{background:rgba(127,127,127,.2);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:7px 10px;font:inherit;outline:0}
#apps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;overflow:auto}
#apps div{text-align:center;padding:8px 2px;border-radius:10px;cursor:pointer;font-size:12px}
#apps div:hover{background:rgba(127,127,127,.25)}#apps b{display:block;font-size:28px;font-weight:400}
#ctx{position:fixed;background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:4px;z-index:100000;display:none;min-width:150px;backdrop-filter:blur(14px)}
#ctx div{padding:7px 12px;border-radius:7px;cursor:pointer;font-size:13px}#ctx div:hover{background:var(--ac);color:#fff}
#lock,#boot{position:fixed;inset:0;z-index:200000;background:var(--wp) center/cover;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-shadow:0 2px 8px #000;transition:opacity .5s,transform .5s}
#boot{background:#000;z-index:300000;font-size:22px}
#lock .tm{font-size:72px;font-weight:200}#lock .dt{font-size:18px;margin-bottom:30px}
.hide{opacity:0;pointer-events:none}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--pn);border:1px solid var(--bd);padding:9px 16px;border-radius:10px;z-index:400000;font-size:13px}
.bar{display:flex;gap:6px;padding:6px;background:rgba(127,127,127,.12);flex:none;flex-wrap:wrap;align-items:center}
.list{flex:1;overflow:auto;padding:6px}
.row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:14px}
.row:hover{background:rgba(127,127,127,.2)}.row.sel{background:rgba(59,130,246,.35)}
textarea.ed{flex:1;width:100%;border:0;background:transparent;color:var(--tx);font:15px/1.6 monospace;padding:10px;resize:none;outline:0;user-select:text}
.term{background:#050a14;color:#7CFC9A;font:14px/1.5 monospace;padding:8px;flex:1;overflow:auto;direction:ltr;text-align:left;user-select:text;white-space:pre-wrap}
.term input{background:transparent;border:0;color:#7CFC9A;font:inherit;outline:0;width:70%}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px;flex:1}
.calc button{font-size:20px;border:0;border-radius:10px;background:rgba(127,127,127,.25);color:var(--tx);cursor:pointer}
.calc button.o{background:var(--ac);color:#fff}
.calc .scr{grid-column:1/5;text-align:left;direction:ltr;font-size:34px;padding:8px;background:rgba(0,0,0,.25);border-radius:10px;min-height:56px;overflow:hidden}
canvas{max-width:100%;touch-action:none}
.card{background:rgba(127,127,127,.15);border-radius:12px;padding:12px;margin:6px;display:flex;gap:10px;align-items:center}
.card b.i{font-size:32px;font-weight:400}.card div{flex:1}
.wps{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;padding:8px}
.wps div{height:60px;border-radius:10px;cursor:pointer;border:2px solid transparent}.wps div.on{border-color:var(--ac)}
.key{display:inline-block;width:11.5%;height:130px;background:#fff;color:#000;border:1px solid #888;border-radius:0 0 8px 8px;vertical-align:top;cursor:pointer;font-size:12px;padding-top:100px;text-align:center}
.key.k{background:#111;color:#fff;height:80px;width:8%;margin:0 -4%;position:relative;z-index:2;padding-top:55px}
.key:active{background:var(--ac)}
.win{animation:pop .18s ease-out}@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
#tray{display:flex;gap:8px;font-size:13px;opacity:.9;white-space:nowrap}#nc{position:fixed;bottom:52px;left:8px;width:300px;max-width:calc(100% - 16px);max-height:60vh;overflow:auto;background:var(--pn);backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:14px;padding:10px;z-index:99998;display:none}#nc.on{display:block}#nc .n{padding:8px;border-radius:8px;background:rgba(127,127,127,.18);margin:5px 0;font-size:13px}
.row[draggable=true]{cursor:grab}.row.over{outline:2px dashed var(--ac)}
@media(max-width:700px){.win{inset:0 0 0 0!important;width:auto!important;height:auto!important;border-radius:0;resize:none}.tb{cursor:default}#tasks button{max-width:70px}}
</style></head><body>
<div id="desk"><div id="icons"></div></div>
<div id="tbar"><button id="start">☰ ابدأ</button><div id="tasks"></div><span id="tray"><span id="net">📶</span><span id="bat"></span></span><button id="clk"></button></div>
<div id="menu"><input id="srch" placeholder="ابحث عن تطبيق..."><div id="apps"></div><div style="display:flex;gap:6px"><button class="btn" id="mLock">🔒 قفل</button><button class="btn" id="mRe">⟳ إعادة تشغيل</button></div></div>
<div id="ctx"></div>
<div id="lock"><div class="tm" id="ltm"></div><div class="dt" id="ldt"></div><div id="lhint">اضغط في أي مكان للدخول</div></div>
<div id="boot">⏻ ويب OS... جاري التشغيل</div>
<script>
'use strict';
const $=(s,e=document)=>e.querySelector(s),el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.textContent=h;return e};
const KEY='webos_v1';
const WPS=['linear-gradient(135deg,#1e3a8a,#7c3aed,#db2777)','linear-gradient(160deg,#0f2027,#203a43,#2c5364)','linear-gradient(135deg,#f6d365,#fda085)','linear-gradient(135deg,#134e5e,#71b280)','radial-gradient(circle at 30% 20%,#fbbf24,#b45309 40%,#451a03)','linear-gradient(135deg,#000,#434343)','linear-gradient(135deg,#ff9a9e,#a18cd1)','linear-gradient(135deg,#0ba360,#3cba92)'];
function defFS(){return{t:'d',c:{'المستندات':{t:'d',c:{'مرحبا.txt':{t:'f',d:'أهلاً بك في ويب OS!\nده نظام تشغيل كامل شغال في المتصفح.\nكل ملفاتك بتتحفظ على جهازك.'},'أفكار.txt':{t:'f',d:'- مشروع جديد\n- اتعلم حاجة جديدة'}}},'الصور':{t:'d',c:{}},'التنزيلات':{t:'d',c:{}},'سطح المكتب':{t:'d',c:{}}}}}
let S;try{S=JSON.parse(localStorage[KEY])}catch(e){}
if(!S||!S.fs)S={fs:defFS(),wp:0,ac:'#3b82f6',light:false,inst:['clock'],trash:[]};
const save=()=>{try{localStorage[KEY]=JSON.stringify(S)}catch(e){toast('المساحة امتلأت!')}};
var toast=function(m){const t=el('div','toast',m);document.body.append(t);setTimeout(()=>t.remove(),2200)};
/* FS */
const split=p=>p.split('/').filter(Boolean);
function node(p){let n=S.fs;for(const s of split(p)){if(!n||n.t!=='d'||!(s in n.c))return null;n=n.c[s]}return n}
function parent(p){const a=split(p),nm=a.pop();return{dir:node('/'+a.join('/')),nm,path:'/'+a.join('/')}}
const join=(a,b)=>(a==='/'?'':a)+'/'+b;
function uniq(dir,nm){if(!(nm in dir.c))return nm;const m=nm.match(/^(.*?)(\.[^.]*)?$/);let i=2;while((m[1]+' ('+i+')'+(m[2]||'')) in dir.c)i++;return m[1]+' ('+i+')'+(m[2]||'')}
function writeF(p,d){const{dir,nm}=parent(p);if(!dir)return false;dir.c[nm]={t:'f',d};save();return true}
function mk(p){const{dir,nm}=parent(p);if(!dir||nm in dir.c)return false;dir.c[nm]={t:'d',c:{}};save();return true}
function rm(p){const{dir,nm}=parent(p);if(!dir||!dir.c[nm])return false;S.trash.push({nm,n:dir.c[nm],from:p});delete dir.c[nm];save();return true}
/* APPS registry */
const APPS={};function app(id,name,icon,fn,o={}){APPS[id]=Object.assign({id,name,icon,fn},o)}
/* WM */
let z=10,wins=[],act=null;
function openApp(id,arg){const a=APPS[id];if(!a)return;if(a.single){const w=wins.find(w=>w.id===id);if(w){focus(w);return w}}
const w={id,app:a,el:el('div','win'),btn:el('button')};const W=w.el;
const n=wins.length%7;W.style.cssText=`width:${a.w||560}px;height:${a.h||400}px;left:${60+n*28}px;top:${30+n*28}px`;
const tb=el('div','tb');const ico=el('span','',a.icon);const t=el('div','t',a.name);w.setTitle=s=>{t.textContent=s;w.btn.textContent=a.icon+' '+s};
const bm=el('button','','–'),bx=el('button','','□'),bc=el('button','x','✕');tb.append(ico,t,bm,bx,bc);
const body=el('div','body');W.append(tb,body);$('#desk').append(W);
w.body=body;w.close=()=>{W.remove();w.btn.remove();wins=wins.filter(x=>x!==w);w.onclose&&w.onclose();if(act===w)act=null};
bc.onclick=w.close;bm.onclick=()=>{W.classList.add('min');w.btn.classList.remove('on')};bx.onclick=()=>W.classList.toggle('max');
tb.ondblclick=e=>{if(e.target===tb||e.target===t)W.classList.toggle('max')};
let dx,dy,dr=false;tb.onpointerdown=e=>{if(e.target.tagName==='BUTTON'||W.classList.contains('max'))return;dr=true;dx=e.clientX-W.offsetLeft;dy=e.clientY-W.offsetTop;tb.setPointerCapture(e.pointerId)};
tb.onpointermove=e=>{if(dr){W.style.left=Math.max(-W.offsetWidth+60,Math.min(innerWidth-60,e.clientX-dx))+'px';W.style.top=Math.max(0,e.clientY-dy)+'px'}};tb.onpointerup=()=>dr=false;
W.onpointerdown=()=>focus(w);w.btn.onclick=()=>{if(act===w&&!W.classList.contains('min')){W.classList.add('min');w.btn.classList.remove('on')}else focus(w)};
$('#tasks').append(w.btn);w.setTitle(a.name);wins.push(w);focus(w);a.fn(w,arg);return w}
function focus(w){w.el.classList.remove('min');w.el.style.zIndex=++z;act=w;wins.forEach(x=>x.btn.classList.toggle('on',x===w))}
/* Desktop icons, menu */
const BASE=['files','notes','terminal','browser','calc','paint','sheet','snake','g2048','tetris','store','settings','tasks'];
var allApps=function(){return BASE.concat(S.inst.filter(x=>APPS[x]&&!BASE.includes(x)))};
function renderDesk(){const c=$('#icons');c.innerHTML='';allApps().slice(0,10).forEach(id=>{const a=APPS[id],d=el('div','ic');d.append(el('b','',a.icon),el('span','',a.name));d.ondblclick=()=>openApp(id);d.onclick=e=>{if(matchMedia('(max-width:700px)').matches||e.detail>1)openApp(id);document.querySelectorAll('.ic').forEach(x=>x.classList.remove('sel'));d.classList.add('sel')};c.append(d)});
const sd=node('/سطح المكتب');if(sd)Object.keys(sd.c).forEach(k=>{const n=sd.c[k],d=el('div','ic');d.append(el('b','',n.t==='d'?'📁':'📄'),el('span','',k));d.ondblclick=()=>openPath('/سطح المكتب/'+k);c.append(d)})}
function renderMenu(q=''){const g=$('#apps');g.innerHTML='';Object.values(APPS).filter(a=>(allApps().includes(a.id))&&a.name.includes(q)).forEach(a=>{const d=el('div');d.append(el('b','',a.icon),el('span','',a.name));d.onclick=()=>{$('#menu').classList.remove('on');openApp(a.id)};g.append(d)})}
$('#start').onclick=e=>{e.stopPropagation();renderMenu();$('#menu').classList.toggle('on');$('#srch').value=''};
$('#srch').oninput=e=>renderMenu(e.target.value);
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#menu,#start'))$('#menu').classList.remove('on');if(!e.target.closest('#ctx'))$('#ctx').style.display='none'});
function ctx(x,y,items){const c=$('#ctx');c.innerHTML='';items.forEach(([t,f])=>{const d=el('div','',t);d.onclick=()=>{c.style.display='none';f()};c.append(d)});c.style.display='block';c.style.left=Math.min(x,innerWidth-170)+'px';c.style.top=Math.min(y,innerHeight-items.length*34-60)+'px'}
$('#desk').oncontextmenu=e=>{if(e.target.closest('.win'))return;e.preventDefault();ctx(e.clientX,e.clientY,[['📁 مجلد جديد',()=>{const n=prompt('اسم المجلد');if(n){mk('/سطح المكتب/'+n);renderDesk()}}],['📄 ملف نصي جديد',()=>{const n=prompt('اسم الملف','جديد.txt');if(n){writeF('/سطح المكتب/'+n,'');renderDesk()}}],['🖼️ تغيير الخلفية',()=>{S.wp=(S.wp+1)%WPS.length;theme();save()}],['⚙️ الإعدادات',()=>openApp('settings')]])};
let lp;$('#desk').ontouchstart=e=>{if(e.target.closest('.win')||e.target.closest('.ic'))return;const t=e.touches[0];lp=setTimeout(()=>$('#desk').oncontextmenu({target:e.target,clientX:t.clientX,clientY:t.clientY,preventDefault(){}}),600)};$('#desk').ontouchend=()=>clearTimeout(lp);
function theme(){document.documentElement.style.setProperty('--wp',WPS[S.wp]);document.documentElement.style.setProperty('--ac',S.ac);document.body.classList.toggle('light',S.light)}
function clock(){const d=new Date();$('#clk').textContent=d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});$('#ltm').textContent=d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});$('#ldt').textContent=d.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'})}
setInterval(clock,1000);
$('#lock').onclick=()=>$('#lock').classList.add('hide');$('#mLock').onclick=()=>{$('#menu').classList.remove('on');$('#lock').classList.remove('hide')};$('#mRe').onclick=()=>location.reload();
$('#clk').onclick=()=>openApp('clock');
/* openPath */
var openPath=function(p){const n=node(p);if(!n)return;if(n.t==='d')return openApp('files',p);if(/\.(png|jpe?g|gif|webp)$/i.test(p)||(n.d||'').startsWith('data:image'))return openApp('viewer',p);if((n.d||'').startsWith('data:audio')||(n.d||'').startsWith('data:video'))return openApp('media',p);openApp('notes',p)}
/* FILES */
app('files','الملفات','📁',(w,start)=>{let cwd=typeof start==='string'?start:'/',sel=null;const bar=el('div','bar'),list=el('div','list');w.body.append(bar,list);
const up=el('button','btn','⬆️'),path=el('span','', ''),nf=el('button','btn','📁+'),nt=el('button','btn','📄+'),rn=el('button','btn','✏️'),dl=el('button','btn','🗑️'),up2=el('button','btn','⬆ رفع'),dn=el('button','btn','⬇ تنزيل');path.style.flex=1;path.style.direction='ltr';
bar.append(up,nf,nt,rn,dl,up2,dn,path);const fi=el('input');fi.type='file';fi.multiple=true;fi.hidden=true;w.body.append(fi);
function draw(){w.cwd=cwd;w.redraw=draw;list.innerHTML='';path.textContent=cwd;w.setTitle('الملفات - '+(cwd==='/'?'الرئيسية':split(cwd).pop()));const d=node(cwd);Object.keys(d.c).sort((a,b)=>(d.c[b].t==='d')-(d.c[a].t==='d')||a.localeCompare(b)).forEach(k=>{const n=d.c[k],r=el('div','row'+(sel===k?' sel':''));r.append(el('span','',n.t==='d'?'📁':/\.(png|jpe?g|gif|webp)$/i.test(k)?'🖼️':'📄'),el('span','',k));r.draggable=true;r.dataset.nm=k;if(n.t==='d')r.dataset.dir=1;r.onclick=()=>{if(sel===k||matchMedia('(max-width:700px)').matches){if(n.t==='d'){cwd=join(cwd,k);sel=null}else openPath(join(cwd,k))}sel=k;draw()};r.ondblclick=()=>{if(n.t==='d'){cwd=join(cwd,k);sel=null;draw()}else openPath(join(cwd,k))};list.append(r)});if(!Object.keys(d.c).length)list.append(el('div','row','المجلد فاضي'))}
up.onclick=()=>{cwd=parent(cwd).path;sel=null;draw()};nf.onclick=()=>{const n=prompt('اسم المجلد');if(n&&!mk(join(cwd,n)))toast('الاسم مستخدم');draw();renderDesk()};
nt.onclick=()=>{const n=prompt('اسم الملف','جديد.txt');if(n){writeF(join(cwd,n),'');draw();renderDesk()}};
rn.onclick=()=>{if(!sel)return toast('اختار ملف');const n=prompt('الاسم الجديد',sel);const d=node(cwd);if(n&&!(n in d.c)){d.c[n]=d.c[sel];delete d.c[sel];sel=n;save();draw();renderDesk()}};
dl.onclick=()=>{if(!sel)return toast('اختار ملف');rm(join(cwd,sel));sel=null;draw();renderDesk();toast('اتنقل لسلة المحذوفات')};
up2.onclick=()=>fi.click();fi.onchange=()=>{[...fi.files].forEach(f=>{const r=new FileReader();const img=f.type.startsWith('image/');r.onload=()=>{writeF(join(cwd,uniq(node(cwd),f.name)),r.result);draw()};img?r.readAsDataURL(f):r.readAsText(f)})};
dn.onclick=()=>{const n=sel&&node(join(cwd,sel));if(!n||n.t!=='f')return toast('اختار ملف');const a=el('a');a.href=n.d.startsWith('data:')?n.d:URL.createObjectURL(new Blob([n.d]));a.download=sel;a.click()};
draw()},{w:600,h:420});
/* NOTES */
app('notes','المفكرة','📝',(w,p)=>{const bar=el('div','bar'),ta=el('textarea','ed');ta.placeholder='اكتب هنا...';let path=typeof p==='string'?p:null;
const sv=el('button','btn','💾 حفظ'),sa=el('button','btn','حفظ باسم'),nw=el('button','btn','جديد');bar.append(sv,sa,nw);w.body.append(bar,ta);
if(path){const n=node(path);ta.value=n&&n.t==='f'?n.d:'';w.setTitle('المفكرة - '+split(path).pop())}
const doSave=as=>{if(!path||as){const n=prompt('احفظ في','/المستندات/'+(path?split(path).pop():'ملف.txt'));if(!n)return;path=n.startsWith('/')?n:'/المستندات/'+n}
if(writeF(path,ta.value)){toast('اتحفظ ✓');w.setTitle('المفكرة - '+split(path).pop());renderDesk()}else toast('المسار غلط')};
sv.onclick=()=>doSave(false);sa.onclick=()=>doSave(true);nw.onclick=()=>{path=null;ta.value='';w.setTitle('المفكرة')};
ta.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();doSave(false)}}},{w:520,h:380});
/* VIEWER */
